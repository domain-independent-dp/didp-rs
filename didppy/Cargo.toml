[package]
name = "didppy"
version = "0.10.1"
edition = "2021"
rust-version = "1.85"
description = "Python interface for Dynamic Programming Description Language (DyPDL) and DyPDL solvers."
license = "MIT OR Apache-2.0"
authors = [
    "Ryo Kuroiwa <kuroiwa@nii.ac.jp>",
    "Yuxiao (Jasper) Chen <yuxiao.chen@mail.utoronto.ca>",
    "Anubhav Singh <anubhav.singh@utoronto.ca>",
]
homepage = "https://didp.ai"
repository = "https://github.com/domain-independent-dp/didp-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "didppy"
crate-type = ["cdylib"]

[dependencies]
dypdl = { path = "../dypdl", version = "0.10.1" }
dypdl-heuristic-search = { path = "../dypdl-heuristic-search", version = "0.10.1" }
didp-yaml = { path = "../didp-yaml", version = "0.10.1" }
rustc-hash = "2.1.2"
yaml-rust = { package = "yaml-rust2", version = "0.11.0" }

[dependencies.pyo3]
version = "0.28.3"

[features]
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py37"]
default = ["extension-module", "abi3"]

[build-dependencies]
pyo3-build-config = "0.28.3"
