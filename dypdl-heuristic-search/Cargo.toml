[package]
name = "dypdl-heuristic-search"
version = "0.10.1"
edition = "2021"
rust-version = "1.85"
description = "Heuristic search solvers for Dynamic Programming Description Language (DyPDL)."
license = "MIT OR Apache-2.0"
authors = [
    "Ryo Kuroiwa <kuroiwa@nii.ac.jp>",
    "Yuxiao (Jasper) Chen <yuxiao.chen@mail.utoronto.ca>",
    "Anubhav Singh <anubhav.singh@utoronto.ca>",
]
homepage = "https://didp.ai"
repository = "https://github.com/domain-independent-dp/didp-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ordered-float = "5.3.0"
dypdl = { path = "../dypdl", version = "0.10.1" }
rustc-hash = "2.1.2"
dashmap = "6.2.1"
rayon = "1.12.0"
rand = "0.10.1"
rand_pcg = "0.10.2"
smallvec = "1.15.1"
